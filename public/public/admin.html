here<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Election admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1C060B;--ink:#F8EEE9;--mute:#B79A9E;--line:rgba(248,238,233,.16);--accent:#E23B4E;--pick:#FFA27F;--err:#FF8A8F;
  --serif:"Fraunces","Bitstream Charter",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;
  background-image:radial-gradient(800px 600px at 100% 0%,rgba(190,30,55,.30),transparent 60%);background-attachment:fixed}
main{max-width:860px;margin:0 auto;padding:44px 22px 90px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,7vw,48px);line-height:1.05;letter-spacing:-.5px}
h2{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:16px}
.lede{margin-top:10px;color:var(--mute)}
input{width:100%;margin-top:22px;padding:15px 17px;font:inherit;font-size:17px;color:var(--ink);background:rgba(248,238,233,.06);
  border:1.5px solid var(--line);border-radius:12px;outline:none}
input:focus{border-color:var(--pick)}
button{font:600 15px var(--sans);padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--err);border-color:rgba(255,138,143,.4)}
.err{margin-top:14px;color:var(--err);min-height:1px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.pill{display:inline-block;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;border:1.5px solid var(--line)}
.pill.open{color:#7FD99C;border-color:rgba(127,217,156,.45)}.pill.closed{color:var(--err);border-color:rgba(255,138,143,.45)}
.total{margin:34px 0 6px;font-family:var(--serif);font-size:clamp(56px,14vw,96px);line-height:1}
.total small{font:500 16px var(--sans);color:var(--mute);margin-left:10px}
.actions{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px}
.sec{margin-top:52px;padding-top:28px;border-top:1px solid var(--line)}
.row{margin-bottom:16px}
.row .l{display:flex;justify-content:space-between;gap:16px;font-weight:600}
.row .l span:last-child{font-variant-numeric:tabular-nums}
.row .l.win span:first-child::after{content:" · leading";color:var(--pick);font-weight:500}
.track{margin-top:7px;height:9px;border-radius:5px;background:rgba(248,238,233,.10);overflow:hidden}
.track i{display:block;height:100%;background:var(--pick);border-radius:5px;transition:width .4s}
.abs{color:var(--mute);font-size:14px;margin-top:4px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:13px}
td.n{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let pw = sessionStorage.getItem("adminPw") || "", data = null;

async function call(opts = {}) {
  const r = await fetch("/api/results", { ...opts, headers: { "x-admin-password": pw, "content-type": "application/json" } });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.error || "Request failed.");
  return d;
}

function login(msg = "") {
  app.innerHTML = `<h1>Election admin</h1><p class="lede">Enter the admin password to see results.</p>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <p class="err" id="err" role="alert">${esc(msg)}</p>
    <div class="actions"><button class="primary" id="go">Open dashboard</button></div>`;
  const go = async () => {
    pw = document.getElementById("pw").value;
    try { data = await call(); sessionStorage.setItem("adminPw", pw); dash(); }
    catch (e) { document.getElementById("err").textContent = e.message; }
  };
  document.getElementById("go").onclick = go;
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") go(); };
}

function dash() {
  const open = data.status === "open";
  app.innerHTML = `
    <div class="top"><div><h1>${esc(data.title)}</h1><p class="lede">Admin dashboard</p></div>
      <span class="pill ${open ? "open" : "closed"}">${open ? "Voting open" : "Voting closed"}</span></div>
    <div class="total">${data.total}<small>${data.total === 1 ? "vote" : "votes"} cast</small></div>
    <div class="actions">
      <button id="refresh">Refresh</button>
      <button id="toggle" class="${open ? "" : "primary"}">${open ? "Close voting" : "Reopen voting"}</button>
      <button id="csv">Download CSV</button>
      <button id="logout">Log out</button>
    </div>
    ${data.tallies.map(t => {
      const max = Math.max(1, ...t.candidates.map(c => c.votes));
      const lead = Math.max(...t.candidates.map(c => c.votes));
      const sum = t.candidates.reduce((a, c) => a + c.votes, 0) || 1;
      return `<section class="sec"><h2>${esc(t.title)}</h2>
        ${t.candidates.map(c => `<div class="row"><div class="l ${lead > 0 && c.votes === lead ? "win" : ""}"><span>${esc(c.name)}</span>
          <span>${c.votes} · ${Math.round(c.votes / sum * 100)}%</span></div>
          <div class="track"><i style="width:${c.votes / max * 100}%"></i></div></div>`).join("")}
        <p class="abs">Abstained: ${t.abstain}</p></section>`;
    }).join("")}
    <section class="sec"><h2>Voters</h2>
      <div class="scroll"><table><thead><tr><th>#</th><th>Name</th><th>Student no.</th><th>Time</th><th>Code</th></tr></thead><tbody>
      ${data.voters.map((v, i) => `<tr><td class="n">${i + 1}</td><td>${esc(v.name)}</td><td class="n">${esc(v.studentNo)}</td>
        <td>${esc(new Date(v.at).toLocaleString())}</td><td class="n">${esc(v.ref)}</td></tr>`).join("") || `<tr><td colspan="5" style="color:var(--mute)">No votes yet.</td></tr>`}
      </tbody></table></div></section>
    <section class="sec"><h2>Danger zone</h2>
      <p class="lede" style="margin:0 0 16px">Deletes every vote. Use this to clear test votes before the real election.</p>
      <button class="danger" id="reset">Reset all votes</button><p class="err" id="err" role="alert"></p></section>`;

  const reload = async () => { try { data = await call(); dash(); } catch (e) { login(e.message); } };
  document.getElementById("refresh").onclick = reload;
  document.getElementById("logout").onclick = () => { sessionStorage.removeItem("adminPw"); pw = ""; login(); };
  document.getElementById("toggle").onclick = async () => {
    try { await call({ method: "POST", body: JSON.stringify({ action: open ? "close" : "open" }) }); reload(); }
    catch (e) { document.getElementById("err").textContent = e.message; }
  };
  document.getElementById("reset").onclick = async () => {
    const t = prompt("This deletes ALL votes and cannot be undone.\nType RESET to confirm.");
    if (t !== "RESET") return;
    try { await call({ method: "POST", body: JSON.stringify({ action: "reset", confirm: "RESET" }) }); reload(); }
    catch (e) { document.getElementById("err").textContent = e.message; }
  };
  document.getElementById("csv").onclick = () => {
    const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const head = ["Name", "Student number", "Time", "Code", ...data.positions.map(p => p.title)];
    const rows = data.voters.map(v => [v.name, v.studentNo, v.at, v.ref, ...data.positions.map(p => {
      const id = v.choices[p.id]; return id === "abstain" ? "Abstain" : (p.candidates.find(c => c.id === id)?.name || id);
    })]);
    const csv = [head, ...rows].map(r => r.map(cell).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
    a.download = "votes.csv"; a.click();
  };
}

(async () => {
  if (!pw) return login();
  try { data = await call(); dash(); } catch (e) { login(e.message); }
})();
</script>
</body>
</html>
